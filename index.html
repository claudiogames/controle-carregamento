<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Operacional</title>
    <!-- Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase Client (opcional, caso utilize no seu app) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        <!-- Cabeçalho -->
        <header class="bg-slate-800 border border-slate-700 p-6 rounded-xl shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Painel Operacional</h1>
                <p class="text-sm text-slate-400">Controle de Status e Requisições (Com atraso de salvamento de 3s no Enter)</p>
            </div>
            <div id="status-sinc" class="px-3 py-1 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium rounded-full flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Sincronizado
            </div>
        </header>

        <!-- Seção de Entrada (Com atraso de 3s no Enter) -->
        <section class="bg-slate-800 border border-slate-700 p-6 rounded-xl shadow-lg space-y-4">
            <h2 class="text-lg font-semibold text-white">Nova Entrada / Requisição</h2>
            <div>
                <label for="input-registro" class="block text-sm text-slate-400 mb-1">Digite o código/item e aperte Enter (salva após 3s):</label>
                <input 
                    type="text" 
                    id="input-registro" 
                    placeholder="Ex: SSCC ou Caixa #1029" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors"
                >
            </div>
            <div id="feedback-timer" class="text-xs text-amber-400 font-medium min-h-[1rem]"></div>
        </section>

        <!-- Seção de Listagem e Gerenciamento de Status -->
        <section class="bg-slate-800 border border-slate-700 p-6 rounded-xl shadow-lg space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold text-white">Itens e Status (Outra Tela / Painel)</h2>
                <button onclick="carregarItens()" class="text-xs text-indigo-400 hover:text-indigo-300 transition-colors">Atualizar Lista</button>
            </div>

            <!-- Tabela de Itens -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-xs text-slate-400 uppercase">
                            <th class="py-3 px-4">ID / Item</th>
                            <th class="py-3 px-4">Status Atual</th>
                            <th class="py-3 px-4 text-right">Ações de Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-itens" class="divide-y divide-slate-700 text-sm">
                        <!-- Os dados serão injetados via JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Script Principal -->
    <script>
        // Simulação de banco de dados local (Substitua pelas chamadas do seu Supabase se necessário)
        let itens = [
            { id: 1, codigo: "Caixa 001 - Avaria", status: "Pendente" },
            { id: 2, codigo: "Palete Portão 02", status: "Em andamento" },
            { id: 3, codigo: "Requisição #409", status: "Entregue" }
        ];

        let debounceTimer = null;
        const inputElement = document.getElementById('input-registro');
        const feedbackTimer = document.getElementById('feedback-timer');
        const statusSinc = document.getElementById('status-sinc');

        // --- 1. Lógica do Enter com Delay de 3 Segundos ---
        inputElement.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                const valor = inputElement.value.trim();
                if (!valor) return;

                // Limpa o timer anterior se o usuário pressionar Enter novamente antes de 3s
                clearTimeout(debounceTimer);

                feedbackTimer.textContent = "⏳ Aguardando 3 segundos para salvar e sincronizar...";
                mudarStatusSincronizacao('pendente');

                // Inicia a contagem de 3 segundos
                debounceTimer = setTimeout(() => {
                    salvarESincronizar(valor);
                }, 3000); 
            }
        });

        function salvarESincronizar(novoValor) {
            feedbackTimer.textContent = "💾 Salvando e sincronizando dados...";
            
            // Adiciona o novo item simulando o salvamento
            const novoItem = {
                id: Date.now(),
                codigo: novoValor,
                status: "Pendente"
            };
            
            itens.unshift(novoItem);
            inputElement.value = '';
            
            setTimeout(() => {
                feedbackTimer.textContent = "✅ Salvo e sincronizado com sucesso!";
                mudarStatusSincronizacao('sucesso');
                renderizarTabela();
                
                setTimeout(() => {
                    feedbackTimer.textContent = "";
                }, 3000);
            }, 800);
        }

        function mudarStatusSincronizacao(estado) {
            if (estado === 'pendente') {
                statusSinc.className = "px-3 py-1 bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-medium rounded-full flex items-center gap-2";
                statusSinc.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span> Sincronizando...`;
            } else {
                statusSinc.className = "px-3 py-1 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium rounded-full flex items-center gap-2";
                statusSinc.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Sincronizado`;
            }
        }

        // --- 2. Correção dos Botões de Status (Outra Tela) ---
        function atualizarStatus(id, novoStatus) {
            // Encontra o item no array e atualiza o status de forma precisa
            const item = itens.find(i => i.id === id);
            if (item) {
                item.status = novoStatus;
                
                // Se estiver usando Supabase, adicione sua chamada aqui:
                // await supabase.from('sua_tabela').update({ status: novoStatus }).eq('id', id);

                renderizarTabela();
                
                // Feedback rápido de sincronização individual
                feedbackTimer.textContent = `Status do item #${id} alterado para "${novoStatus}"`;
                setTimeout(() => feedbackTimer.textContent = "", 2000);
            }
        }

        function renderizarTabela() {
            const tbody = document.getElementById('tabela-itens');
            tbody.innerHTML = '';

            if (itens.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-slate-500">Nenhum item cadastrado.</td></tr>`;
                return;
            }

            itens.forEach(item => {
                // Define a cor da badge de acordo com o status
                let badgeColor = "bg-slate-700 text-slate-300";
                if (item.status === "Pendente") badgeColor = "bg-amber-500/10 text-amber-400 border border-amber-500/20";
                if (item.status === "Em andamento") badgeColor = "bg-indigo-500/10 text-indigo-400 border border-indigo-500/20";
                if (item.status === "Entregue") badgeColor = "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-750 transition-colors";
                tr.innerHTML = `
                    <td class="py-3 px-4 font-medium text-white">${item.codigo}</td>
                    <td class="py-3 px-4">
                        <span class="px-2.5 py-1 rounded-full text-xs font-medium ${badgeColor}">
                            ${item.status}
                        </span>
                    </td>
                    <td class="py-3 px-4 text-right space-x-2">
                        <button onclick="atualizarStatus(${item.id}, 'Pendente')" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-xs rounded text-amber-300 transition-colors">Pendente</button>
                        <button onclick="atualizarStatus(${item.id}, 'Em andamento')" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-xs rounded text-indigo-300 transition-colors">Andamento</button>
                        <button onclick="atualizarStatus(${item.id}, 'Entregue')" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-xs rounded text-emerald-300 transition-colors">Entregue</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Inicializa a tabela ao carregar a página
        renderizarTabela();
        
        function carregarItens() {
            // Função para simular recarga de dados do servidor
            renderizarTabela();
        }
    </script>
</body>
</html>
